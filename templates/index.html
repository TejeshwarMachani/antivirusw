<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Upload files to scan for viruses and malware">
    <title>Antivirus File Scanner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div id="app-container">

        <!-- Upload View (shown by default) -->
        <div id="upload-view">
            <h1>Upload File for Scanning</h1>
            <div id="drop-zone">
                <div class="upload-icon">📁</div>
                <p class="drop-text">Drag and drop file here</p>
                <p class="or-separator">or</p>
                <button id="browse-btn" class="btn-secondary">Browse Files</button>
            </div>
            <input type="file" id="file-input" style="display:none">
            <div id="file-info">Max size: 100MB | All file types supported</div>
            <div id="upload-error" class="error-message" style="display:none"></div>
        </div>

        <!-- Scanning View (shown during scan) -->
        <div id="scanning-view" style="display:none">
            <h1>Scanning File</h1>
            <div id="file-details">
                <p><strong>File:</strong> <span id="scanning-filename"></span></p>
                <p><strong>Size:</strong> <span id="scanning-filesize"></span></p>
            </div>
            <div id="progress-container">
                <div id="progress-bar">
                    <div id="progress-fill"></div>
                </div>
            </div>
            <div id="scan-status">Scanning for threats...</div>
        </div>

        <!-- Results View (shown after scan) -->
        <div id="results-view" style="display:none">
            <h1>Scan Results</h1>

            <!-- Alert box (green for clean, red for infected, yellow for error) -->
            <div id="alert-box">
                <div id="alert-icon"></div>
                <div id="alert-content">
                    <h2 id="alert-title"></h2>
                    <p id="alert-message"></p>
                </div>
            </div>

            <!-- File information -->
            <div id="result-details"></div>

            <!-- Action buttons -->
            <div id="action-buttons"></div>
        </div>

        <!-- Details Modal (shown when View Details clicked) -->
        <div id="details-modal" class="modal-overlay" style="display:none">
            <div class="modal-box">
                <span id="close-modal" class="close-button">&times;</span>
                <h2>Scan Report</h2>
                <div id="full-report"></div>
            </div>
        </div>

    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
